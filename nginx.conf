# Configuration for production readiness phase
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security Headers - Based on 2024 best practices
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;  # XSS filter disabled as it can introduce vulnerabilities in modern browsers
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # CSP for SPA - More secure configuration
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-eval';  # For development tools
        style-src 'self' 'unsafe-inline';  # For development convenience
        connect-src 'self' http://localhost:* ws://localhost:*;  # For development server
        img-src 'self' data: blob:;
        font-src 'self' data:;
        worker-src 'self' blob:;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        frame-ancestors 'none';
        upgrade-insecure-requests;
    " always;
    # # より厳格な本番環境設定
    # add_header Content-Security-Policy "
    #     default-src 'self';
    #     script-src 'self';
    #     style-src 'self';
    #     connect-src 'self' https:;
    #     object-src 'none';
    #     base-uri 'self';
    #     form-action 'self';
    #     frame-ancestors 'none';
    #  " always;

    # HSTS - Enable only for production with HTTPS
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Performance Optimization
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Disable gzip for IE6 and below
    gzip_disable "msie6";

    # SPA routing - Forward all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
        
        # HTML files - Disable caching
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Static assets - Long-term caching
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        gzip_static on;
    }

    # Images - Medium-term caching
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Vary "Accept-Encoding";
    }

    # API proxy configuration (if needed for production)
    # Uncomment and modify for production API endpoint
    # location /api/ {
    #     proxy_pass http://backend:8000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Security - Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security - Deny access to temporary files
    location ~* \.(bak|tmp|temp|old|orig|save|swo|swp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
